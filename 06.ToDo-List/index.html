<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand">Task<span>Flow</span></div><div class="date" id="today"></div></header>
    <section class="panel">
      <h1>Plan your day.</h1>
      <p class="sub">Small steps make big progress. Add your next task below.</p>
      <form id="taskForm">
        <input id="taskInput" placeholder="What do you need to do?" maxlength="100" required>
        <button type="submit">＋ Add task</button>
      </form>
      <div class="extras">
        <select id="category"><option>Personal</option><option>Study</option><option>Work</option><option>Health</option><option>Other</option></select>
        <select id="priority"><option value="Normal">Normal priority</option><option value="High">High priority</option><option value="Low">Low priority</option></select>
        <input type="date" id="dueDate" aria-label="Due date">
      </div>
    </section>
    <section class="stats">
      <div class="stat"><b id="total">0</b><small>Total tasks</small></div>
      <div class="stat"><b id="pending">0</b><small>Pending</small></div>
      <div class="stat"><b id="completed">0</b><small>Completed</small></div>
    </section>
    <section class="panel">
      <div class="tools">
        <input id="search" placeholder="Search tasks…">
        <select id="filter"><option value="all">All tasks</option><option value="pending">Pending</option><option value="completed">Completed</option></select>
        <select id="categoryFilter"><option value="all">All categories</option><option>Personal</option><option>Study</option><option>Work</option><option>Health</option><option>Other</option></select>
      </div>
      <div id="list"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
